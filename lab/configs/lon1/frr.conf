frr defaults traditional
hostname lon1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.200.0.1/32
 ip address 10.210.0.1/32
 ip ospf area 0.0.0.0
!
interface eth1
 description lon1-core1
 ip address 10.0.20.1/31
!
interface eth2
 description lon1-lon2
 ip address 10.2.0.0/31
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.200.0.1
 passive-interface lo
!
router bgp 65200
 bgp router-id 10.200.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.20.0 remote-as 65000
 neighbor 10.200.0.2 remote-as 65200
 neighbor 10.200.0.2 update-source lo
 !
 address-family ipv4 unicast
  network 10.210.0.1/32
  neighbor 10.0.20.0 activate
  neighbor 10.200.0.2 activate
  neighbor 10.200.0.2 next-hop-self
 exit-address-family
!
line vty
!
