frr defaults traditional
hostname dub1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.100.0.1/32
 ip address 10.110.0.1/32
 ip ospf area 0.0.0.0
!
interface eth1
 description dub1-core1
 ip address 10.0.10.1/31
!
interface eth2
 description dub1-dub2
 ip address 10.1.0.0/31
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.100.0.1
 passive-interface lo
!
router bgp 65100
 bgp router-id 10.100.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.10.0 remote-as 65000
 neighbor 10.100.0.2 remote-as 65100
 neighbor 10.100.0.2 update-source lo
 !
 address-family ipv4 unicast
  network 10.110.0.1/32
  neighbor 10.0.10.0 activate
  neighbor 10.100.0.2 activate
  neighbor 10.100.0.2 next-hop-self
 exit-address-family
!
line vty
!
